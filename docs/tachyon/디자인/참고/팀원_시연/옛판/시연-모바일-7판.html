<!doctype html>
<html lang="ko">

<title>Tachyon 시연 7판 · 모바일</title>
<script>window.TY_DEMO='mobile'</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style>
/* 입자 고리: 은행 앱 시안의 짜임(점 고리 + 가운데 큰 숫자 + 옆으로 넘기는 카드 + 아래 어두운 줄)은 그대로 두고 겉모습만 바꾼 시안.
   Synaptrix(신경 인터페이스 사이트)에서: 가는 글씨, 여러 색 입자, 가는 섬유, 왼쪽 가는 막대가 붙은 작은 이름표, 네모에 가까운 단추.
   Tachyon만의 것: ① 고리의 점 = 수업 색 입자, 고리 바깥을 흰 타키온 하나가 거꾸로 돈다(시간을 거슬러 오는 입자)
   ② 고른 몫에서 안쪽 마디로 모이는 섬유(시냅스)와 그 위를 흐르는 신호, 메모가 달력에 이어질 때도 같은 표시(점┄점)
   ③ 카드 속 궤적: 마감은 미래(오른쪽)에서 지금으로 날아오는 입자.
   움직임은 전부 CSS/SMIL이고, 캡처(-shot)와 '동작 줄이기' 설정에서는 멈춘다. */
@property --sc { syntax: '<color>'; inherits: true; initial-value: #8f7bff; }
@property --t { syntax: '<number>'; inherits: true; initial-value: 0; }
:root { --t: 0; transition: --t .9s cubic-bezier(.45, 0, .2, 1); /* 밝기: 0 어두움 → 1 밝음. 아래 색은 모두 이 값에서 나와서 함께 이어져 바뀐다 */
  --bg: color-mix(in srgb, #040406, #f3efe6 calc(var(--t) * 100%)); --s1: color-mix(in srgb, #0b0b0e, #fcf9f3 calc(var(--t) * 100%)); --row: color-mix(in srgb, #0c0c10, #faf6ee calc(var(--t) * 100%)); --ink: color-mix(in srgb, #fff, #1d1b22 clamp(0%, calc((var(--t) - .38) * 420%), 100%)); /* 글자는 바탕과 밝기가 엇갈리는 가운데에서 빨리 넘어간다(흐려 보이는 때를 짧게) */
  --vi: color-mix(in srgb, #8f7bff, #5f49dc calc(var(--t) * 100%)); --te: color-mix(in srgb, #35e0c0, #0a8a74 calc(var(--t) * 100%)); --sh: color-mix(in srgb, #000, rgb(90 74 44 / .22) calc(var(--t) * 100%)); --dim: color-mix(in srgb, rgb(0 0 0 / .7), rgb(52 46 36 / .42) calc(var(--t) * 100%));
  --mu: color-mix(in srgb, var(--ink) calc(58% + 10% * var(--t)), transparent); --fa: color-mix(in srgb, var(--ink) calc(34% + 16% * var(--t)), transparent); --ln: color-mix(in srgb, var(--ink) calc(12% + 4% * var(--t)), transparent); }
:root.lt { --t: 1; } @media (prefers-reduced-motion: reduce) { :root { transition: none; } }
* { box-sizing: border-box; margin: 0; }
body { background: #17171b; font: 14px/1.4 Inter, 'Noto Sans KR', ui-sans-serif, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
html.ty-mode-web body { background: var(--bg); }
button, input { font: inherit; color: inherit; } button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.app { position: relative; height: 100%; overflow: hidden; background: var(--bg); display: grid; grid-template-columns: 196px minmax(0, 1fr); color-scheme: dark; }
.web .app { height: 100vh; height: 100dvh; }
small { display: block; font-size: 12px; color: var(--mu); } sup { color: var(--te); font-size: 11px; margin-left: 5px; line-height: 0; }
.num { font-size: 46px; line-height: 1; font-weight: 300; letter-spacing: -.04em; font-variant-numeric: tabular-nums; white-space: nowrap; } .num i { font-style: normal; font-size: .46em; letter-spacing: 0; margin-left: 2px; color: var(--mu); }
/* 왼쪽 메뉴(데스크톱) */
.side { display: flex; flex-direction: column; padding: 26px 22px; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 16px; letter-spacing: -.02em; margin-bottom: 36px; } .logo::before { content: ''; width: 22px; height: 5px; border-radius: 5px; background: linear-gradient(90deg, var(--ink) 22%, var(--vi) 40%, transparent); }
.side nav { display: grid; gap: 2px; } .side nav button { height: 36px; display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--fa); transition: color .25s; } .side nav button:hover { color: var(--mu); } .side nav .on { color: var(--ink); }
.side nav button::before { content: ''; width: 1.5px; height: 12px; background: var(--ln); transition: background .25s, box-shadow .25s; } .side nav .on::before { background: var(--ink); box-shadow: 0 0 8px 1px var(--vi); }
.wb { height: 40px; padding: 0 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; } .wb::after { content: '→'; transition: transform .25s; } .wb:hover::after { transform: translateX(3px); } .wb:disabled { opacity: .4; }
.gb { height: 40px; padding: 0 14px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--ln); color: var(--mu); white-space: nowrap; transition: color .2s, box-shadow .2s; } .gb:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--fa); }
.lb { display: flex; align-items: center; gap: 8px; color: var(--mu); font-size: 12px; padding: 12px 4px 2px; } .lb::before { content: ''; flex: none; width: 1.5px; height: 11px; background: var(--vi); }
/* 가운데 */
.main { display: flex; flex-direction: column; min-height: 0; overflow: hidden auto; scrollbar-width: none; }
.top { flex: none; display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 24px; margin-top: 10px; color: var(--mu); } .bk { font-size: 15px; color: color-mix(in srgb, var(--ink) 86%, transparent); } .top h1 { font-size: 22px; font-weight: 300; letter-spacing: -.03em; color: var(--ink); } .sp { flex: 1; }
.seg { display: flex; padding: 3px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--ln); } .seg button { height: 30px; padding: 0 14px; border-radius: 7px; color: var(--mu); transition: background .25s, color .25s; } .seg .on { background: color-mix(in srgb, var(--ink) 13%, transparent); color: var(--ink); }
/* 고리 화면 */
.rs { flex: 1; display: grid; grid-template-columns: 400px minmax(0, 1fr); align-items: center; padding-bottom: 30px; }
.rw { position: relative; width: 310px; aspect-ratio: 1; margin: 0 auto; transition: --sc .6s; }
@keyframes spin { to { transform: rotate(360deg); } }
.ring { display: block; width: 100%; height: 100%; overflow: visible; animation: spin 300s linear infinite; }
.ring circle { fill: color-mix(in srgb, var(--c, var(--ink)) 62%, var(--ink)); opacity: .5; transform-box: fill-box; transform-origin: center; transition: transform .45s cubic-bezier(.3, 1.5, .5, 1), opacity .3s; }
.ring g.on { filter: drop-shadow(0 0 2px var(--c)) drop-shadow(0 0 7px var(--c)); } .ring g.on circle { opacity: 1; transform: scale(2); }
.intro .ring circle { animation: pop .5s var(--d) backwards; } @keyframes pop { from { opacity: 0; transform: scale(0); } }
.fb { fill: none; stroke: var(--c); stroke-width: .6; opacity: 0; transition: opacity .5s; } g.on .fb { opacity: .85; }
/* 하루 고리: 한 바퀴 = 오늘 0–24시(24시가 위, 시계 방향)라서 돌지 않는다. 빈 시간은 옅게, 잠 · 지난 시간은 더 옅게, 수업 · 일정은 제 색으로 또렷하게, 넣어 본 할 일 자리는 고르기 전까지 옅게. 흰 입자는 지금 시각에 서고 꼬리는 지나온 쪽 */
.ring.day { animation: none; } .ring.day .bg circle { opacity: .22; } .ring.day .bg .z, .ring.day .bg .p { opacity: .09; } .ring.day .eg circle { opacity: .95; transform: scale(1.35); } .ring.day .eg .p { opacity: .3; } .ring.day .eg.on circle { opacity: 1; transform: scale(1.9); } .ring.day g:not(.bg, .eg, .on, .fl) circle:not(.nd, .pl) { opacity: .34; }
.ring.day ~ .mid .num { font-size: 30px; } .ph .ring.day ~ .mid .num { font-size: 22px; }
.ring line { stroke: var(--fa); stroke-width: .7; stroke-linecap: round; } .ring text { fill: var(--mu); font-size: 8.5px; text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; } .ring .nw { fill: var(--ink); font-weight: 600; } .ph .ring text { font-size: 10.5px; }
.ty.day { animation: none; } .ty.day::after { background: conic-gradient(transparent 310deg, var(--ink)); } .ty.day::before { animation: breathe 1.6s ease-in-out infinite alternate; }
.ring .nd, .ring .pl { opacity: 0; } .ring g.on .nd { fill: var(--ink); } .ring .pl, .ring g.on .pl { fill: var(--ink); transform: none; transition: none; animation: none; } .ring g.on .pl { opacity: 1; }
/* 타키온: 고리 바깥을 거꾸로(시계 반대 방향) 도는 흰 입자 하나와 꼬리 */
.ty { position: absolute; inset: 0; pointer-events: none; animation: spin 18s linear infinite reverse; }
.ty::after { content: ''; position: absolute; inset: 0; border-radius: 50%; opacity: .8; background: conic-gradient(var(--ink), transparent 60deg, transparent); mask: radial-gradient(farthest-side, transparent calc(93% - 1.2px), #000 calc(93% - .5px), #000 calc(93% + .5px), transparent calc(93% + 1.2px)); }
.ty::before { content: ''; position: absolute; left: 50%; top: 3.5%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 8px 2px var(--sc); }
.mid { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; pointer-events: none; } .mid > * { position: relative; } .mid .num { font-size: 36px; } .mid span { font-size: 12px; color: var(--mu); }
.mid::before { content: ''; position: absolute; left: 22%; top: 22%; width: 56%; height: 56%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--sc) 42%, transparent), transparent 68%); animation: breathe 4.5s ease-in-out infinite alternate; } @keyframes breathe { from { transform: scale(.88); opacity: .65; } to { transform: scale(1.12); opacity: 1; } }
.cap { margin: 16px auto 0; max-width: 330px; text-align: center; font-size: 12px; color: var(--fa); word-break: keep-all; }
.cw { min-width: 0; }
.car { position: relative; display: flex; gap: 12px; padding: 4px 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; } .car::-webkit-scrollbar { display: none; }
.car::before, .car::after { content: ''; flex: none; width: calc(50% - 144px); }
.card { flex: none; position: relative; overflow: hidden; width: 264px; height: 232px; border-radius: 26px; padding: 20px 22px 22px; display: flex; flex-direction: column; justify-content: space-between; background: var(--s1); box-shadow: inset 0 0 0 1px var(--ln); scroll-snap-align: center; transition: box-shadow .4s; }
.card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .5s; background: radial-gradient(95% 75% at var(--x) 46%, color-mix(in srgb, var(--c) 36%, transparent), transparent 72%); }
.card.on::before { opacity: 1; } .card.on { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); } .card > * { position: relative; transition: opacity .3s; } .card:not(.on) > * { opacity: .5; } .card.dn .num { text-decoration: line-through; text-decoration-thickness: 1px; }
.ch { display: flex; align-items: center; gap: 9px; font-size: 15px; } .ch em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--mu); }
/* 카드 속 궤적: 오른쪽(미래)에서 지금으로 날아오는 입자 */
.tk { position: relative; height: 40px; } .tk::before { content: ''; position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: radial-gradient(circle, color-mix(in srgb, var(--ink) 34%, transparent) 1px, transparent 1.2px) 0 0 / 6px 2px repeat-x; }
.tk u { position: absolute; top: 24px; transform: translateX(-50%); font-size: 10px; color: var(--fa); text-decoration: none; white-space: nowrap; }
.fp { position: absolute; top: 8px; left: var(--x); width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: color-mix(in srgb, var(--c) 40%, var(--ink)); box-shadow: 0 0 10px 2px var(--c); }
.fp::after { content: ''; position: absolute; left: 8px; top: 3.5px; width: 44px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--c), transparent); }
.card.on .fp { animation: fly 1s cubic-bezier(.2, .8, .2, 1); } @keyframes fly { from { left: 100%; opacity: 0; } }
.card.dn .fp { background: var(--fa); box-shadow: none; } .card.dn .fp::after { display: none; }
.bar { position: absolute; top: 9px; height: 8px; min-width: 4px; border-radius: 4px; background: var(--c); opacity: .9; }
.cb { display: grid; gap: 8px; } .cb small { font-size: 13px; color: color-mix(in srgb, var(--ink) 80%, transparent); }
.pg { display: flex; justify-content: center; align-items: center; gap: 8px; height: 30px; } .pg i { width: 4px; height: 4px; border-radius: 50%; background: var(--fa); transition: transform .3s, background .3s, box-shadow .3s; } .pg i.on { background: var(--c); box-shadow: 0 0 8px var(--c); transform: scale(1.6); }
/* 달력: 일 · 주 · 월. 주는 오늘부터(앱 4일, 웹 7일). 지금 시각 = 흰 입자와 선 */
.cal { flex: 1 0 auto; display: flex; flex-direction: column; padding: 0 24px 22px; }
.cal.in > :not(.cn) { animation: calin .4s cubic-bezier(.2, .8, .2, 1); } @keyframes calin { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
.cn { display: flex; align-items: center; gap: 8px; height: 48px; } .cn h2 { font-size: 22px; font-weight: 300; letter-spacing: -.03em; white-space: nowrap; } .cn em { font-style: normal; font-size: 12px; color: var(--te); margin-left: 4px; white-space: nowrap; } .cn .gb { height: 32px; padding: 0 12px; } .gb:disabled { opacity: .35; cursor: default; }
.wh, .tg { display: grid; grid-template-columns: 40px repeat(var(--n), minmax(0, 1fr)); }
.dh { display: grid; justify-items: center; gap: 3px; padding: 4px 0 12px; } .dh small { transition: color .2s; } .dh:hover small { color: var(--ink); } .dh b { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-size: 19px; font-weight: 300; letter-spacing: -.03em; } .dh.td b { background: var(--ink); color: var(--bg); font-weight: 400; box-shadow: 0 0 18px -2px var(--vi); }
.tg { position: relative; flex: 1; min-height: 544px; margin-top: 8px; border-bottom: 1px solid color-mix(in srgb, var(--ink) 7%, transparent); background: linear-gradient(color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1px) 0 0 / 100% 12.5%; }
.ax { position: relative; } .ax u, .nl span { position: absolute; left: 0; width: 32px; text-align: right; font-size: 10px; line-height: 14px; text-decoration: none; color: var(--fa); background: var(--bg); font-variant-numeric: tabular-nums; } .ax u { transform: translateY(-50%); }
.dc { position: relative; min-width: 0; box-shadow: inset 1px 0 0 color-mix(in srgb, var(--ink) 6%, transparent); } .dc.td { background: linear-gradient(color-mix(in srgb, var(--vi) 13%, transparent), transparent 70%); }
.eb { position: absolute; left: 3px; right: 3px; min-height: 18px; overflow: hidden; border-radius: 9px; padding: 4px 8px 4px 10px; background: color-mix(in srgb, var(--c) 22%, var(--s1)); box-shadow: inset 2px 0 0 var(--c); font-size: 12px; line-height: 1.25; } .eb b { display: block; font-weight: 500; overflow-wrap: anywhere; } .eb small { font-size: 10px; line-height: 1.3; white-space: nowrap; } .eb.dn { opacity: .45; } .eb.im { box-shadow: inset 2px 0 0 var(--c), 0 0 16px -4px var(--c); }
.eb.fr { animation: glow 1.1s ease-in-out 2; } @keyframes glow { 50% { box-shadow: inset 2px 0 0 var(--c), 0 0 0 1px var(--c), 0 0 24px var(--c); } }
.dl { position: absolute; left: 3px; right: 3px; height: 0; z-index: 1; border-top: 1px dashed var(--c); } .dl::before { content: ''; position: absolute; left: -1px; top: -4px; width: 7px; height: 7px; border-radius: 50%; background: color-mix(in srgb, var(--c) 40%, var(--ink)); box-shadow: 0 0 8px 1px var(--c); }
.dl span { position: absolute; left: 10px; right: 0; bottom: 3px; font-size: 10px; line-height: 1.2; color: color-mix(in srgb, var(--c) 55%, var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .dl.dn { opacity: .4; } .dl.dn span { text-decoration: line-through; }
.nw { position: absolute; left: 0; right: 0; height: 1px; z-index: 3; pointer-events: none; background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--ink) 20%, transparent)); }
.nw::before, .nw::after { content: ''; position: absolute; left: -4px; top: -3.5px; width: 8px; height: 8px; border-radius: 50%; } .nw::before { background: var(--ink); box-shadow: 0 0 10px 2px var(--vi); } .nw::after { box-shadow: 0 0 0 1px var(--ink); animation: ping 2.4s ease-out infinite; } @keyframes ping { from { opacity: .9; } to { transform: scale(3.4); opacity: 0; } }
.nl { position: absolute; left: 0; right: 0; height: 0; z-index: 2; pointer-events: none; border-top: 1px dashed color-mix(in srgb, var(--ink) 20%, transparent); } .nl span { top: -7px; color: var(--ink); }
.dv { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 28px; } .dv .rows { width: 100%; margin: 0; align-content: start; } .dv .tg { min-height: 720px; } .dv .eb { padding: 4px 12px 4px 14px; font-size: 14px; } .dv .eb small { font-size: 12px; } .dv .dl span { font-size: 12px; }
.mg { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto; grid-auto-rows: minmax(88px, 1fr); gap: 6px; } .mw { font-size: 12px; color: var(--fa); text-align: center; padding: 2px 0 4px; }
.mc { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 8px 9px 12px; border-radius: 14px; background: var(--row); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 6%, transparent); transition: box-shadow .2s; } .mc:hover { box-shadow: inset 0 0 0 1px var(--fa); }
.mc > b { font-size: 13px; font-weight: 400; color: var(--mu); } .mc.out { opacity: .3; } .mc.past:not(.out) { opacity: .55; }
.mc.td { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--vi) 75%, transparent); background: radial-gradient(120% 90% at 50% 100%, color-mix(in srgb, var(--vi) 26%, transparent), transparent 70%) var(--row); } .mc.td > b { color: var(--ink); }
.ml { display: flex; flex-direction: column; gap: 3px; min-width: 0; } .mi { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; color: color-mix(in srgb, var(--ink) 80%, transparent); } .mi em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .mi .dot { width: 5px; height: 5px; } .mi.due .dot { background: none; box-shadow: 0 0 0 1.5px var(--c); }
.mi:nth-child(n+4) { display: none; } .mo { position: absolute; top: 9px; right: 10px; font-size: 10px; color: var(--fa); }
.dp { position: absolute; left: 9px; right: 9px; bottom: 6px; height: 1px; background: color-mix(in srgb, var(--ink) 16%, transparent); } .dp::before { content: ''; position: absolute; left: 0; top: 0; width: var(--p); height: 1px; background: linear-gradient(90deg, transparent, var(--ink)); } .dp::after { content: ''; position: absolute; left: var(--p); top: -2.5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 8px 2px var(--vi); }
/* 어두운 줄 */
.rows { display: grid; gap: 8px; width: min(100% - 32px, 520px); margin: 0 auto; }
.row { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 11px 12px 11px 18px; border-radius: 18px; background: var(--row); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 6%, transparent); }
.row > div:not(.r) { flex: 1; min-width: 0; } .row b { font-weight: 500; overflow-wrap: anywhere; } .row .r { text-align: right; white-space: nowrap; padding-right: 6px; } .row.dn { opacity: .45; }

  const WD = '월화수목금토일';
  const MIN = 60000;
  const HOUR = 60 * MIN;
  const DAY = 24 * HOUR;
  const two = (n) => String(n).padStart(2, '0');

  // 시연 시각: 오늘 10:40으로 고정한다(캡처가 늘 같은 모습이 되게).

  let n = 0;
  const id = () => ++n;
  // source: class = 시간표 수업, ics = 내 캘린더(구글·애플), memo = 메모에서 저장
  const ev = (day, [h1, m1], [h2, m2], title, place, source, important = 0) => ({
    id: id(), title, start: at(day, h1, m1), end: at(day, h2, m2), place, source, important,
  });

  const events = [
    ev(0, [10, 0], [11, 15], '공학수학 2', '26동', 'class'),
    ev(0, [13, 0], [14, 15], '일반화학', '500동', 'class'),
    ev(1, [9, 30], [10, 45], '유기화학', '500동', 'class'),
    ev(1, [13, 0], [14, 50], '생명과학 실험', '500동', 'class'),
    ev(1, [18, 30], [19, 30], '튜터링', '중앙도서관', 'ics'),
    ev(2, [10, 0], [11, 15], '공학수학 2', '26동', 'class'),
    ev(2, [13, 0], [14, 15], '일반화학', '500동', 'class'),
    ev(3, [9, 30], [10, 45], '유기화학', '500동', 'class'),
    ev(3, [19, 0], [20, 0], '조별 과제 회의', '온라인', 'ics'),
    ev(4, [10, 0], [11, 15], '영어 글쓰기', '2동', 'class'),
    ev(4, [15, 0], [16, 0], '일반화학 퀴즈', '500동', 'class', 1),
    ev(5, [11, 0], [15, 0], '알바', null, 'memo'),
    ev(6, [18, 0], [20, 0], '가족 저녁', null, 'ics'),
    ev(7, [10, 0], [11, 15], '공학수학 2', '26동', 'class'),
    ev(8, [9, 30], [10, 45], '유기화학', '500동', 'class'),
    ev(9, [10, 0], [11, 15], '공학수학 2', '26동', 'class'),
    ev(11, [14, 0], [16, 0], '동아리 정기 모임', '학생회관', 'ics'),
    ev(16, [13, 0], [15, 0], '유기화학 중간고사', '500동', 'class', 1),
  ];
  const alba = events.find((e) => e.title === '알바');

  // ready: 1 = 지금 바로 할 수 있음, 0 = 수업·자료가 먼저 있어야 함
  const tasks = [
    { id: id(), title: '유기화학 문제풀이 3장', course: '유기화학', due: at(2, 23, 59), minutes: 120, ready: 1, done: 0 },
    { id: id(), title: '생명과학 실험 보고서', course: '생명과학 실험', due: at(3, 18, 0), minutes: 180, ready: 0, done: 0 },
    { id: id(), title: '영어 에세이 초안', course: '영어 글쓰기', due: at(4, 23, 59), minutes: 120, ready: 1, done: 0 },
    { id: id(), title: '토론 글 올리기', course: '영어 글쓰기', due: at(6, 23, 59), minutes: 30, ready: 1, done: 0 },
    { id: id(), title: '공학수학 2 과제 5', course: '공학수학 2', due: at(9, 23, 59), minutes: 90, ready: 1, done: 0 },
    { id: id(), title: '일반화학 퀴즈 준비', course: '일반화학', due: at(4, 15, 0), minutes: 60, ready: 1, done: 0 },
  ];

  const memos = [
    { id: id(), text: '토요일 알바 11시–3시', at: ago(20 * 60), event: alba },
    { id: id(), text: '과제 3장까지 풀기', at: ago(14 * 60) },
    { id: id(), text: '동아리 회비 걷기 물어보기', at: ago(13 * 60 + 20) },
    { id: id(), text: '실험 보고서 그래프 다시 그리기', at: ago(45) },
  ];

  // ── 글 만들기 ──
  const hm = (d) => `${two(d.getHours())}:${two(d.getMinutes())}`;
  const wd = (d) => WD[(d.getDay() + 6) % 7];
  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const dayDiff = (d) => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / DAY);
  function dayWord(d) {
    const diff = dayDiff(d);
    if (diff === 0) return '오늘';
    if (diff === 1) return '내일';
    if (diff === 2) return '모레';
    if (diff === -1) return '어제';
    const thisMon = (now.getDay() + 6) % 7;
    if (diff + thisMon >= 7) return `다음 주 ${wd(d)}요일`;
    return `${wd(d)}요일`;
  }
  function span(ms) {
    if (ms <= 0) return '지남';
    const d = Math.floor(ms / DAY);
    const h = Math.floor((ms % DAY) / HOUR);
    const m = Math.round((ms % HOUR) / MIN);
    if (d) return h ? `${d}일 ${h}시간` : `${d}일`;
    if (h) return m === 0 ? `${h}시간` : m === 30 ? `${h}시간 반` : `${h}시간 ${m}분`;
    return `${m}분`;
  }
  function ago2(d) {
    const m = Math.round((now - d) / MIN);
    if (m < 1) return '방금';
    if (m < 60) return `${m}분 전`;
    if (sameDay(d, now)) return hm(d);
    return `${dayWord(d)} ${hm(d)}`;
  }
  const minutesWord = (m) => (m >= 60 ? (m % 60 ? `약 ${Math.floor(m / 60)}시간 반` : `약 ${m / 60}시간`) : `${m}분`);
  const dueWord = (t) => `${dayWord(t.due)} ${hm(t.due) === '23:59' ? '자정' : hm(t.due)}`;

  // ── 할 일 순서: 여유(마감까지 남은 시간 − 걸리는 시간)가 적은 순 ──
  function slack(t) {
    return t.due - now - t.minutes * MIN;
  }
  function rankTasks() {
    const open = tasks.filter((t) => !t.done).sort((a, b) => slack(a) - slack(b));
    const weekEnd = at(7, 0);
    const thisWeek = open.filter((t) => t.due < weekEnd).length;
    return {
      tasks: open,
      top: open.slice(0, 3),
      warning: thisWeek >= 4 ? `이번 주 마감 ${thisWeek}개 몰림` : null,
    };
  }
  const slackWord = (t) => `여유 ${span(slack(t))}`;
  // 0(급함) ~ 1(넉넉함): 막대·색 진하기에 쓴다
  const urgency = (t) => Math.max(0, Math.min(1, 1 - slack(t) / (5 * DAY)));

  // ── 달력 ──
  const weekDays = (week = 0) => Array.from({ length: 7 }, (_, i) => at(week * 7 + i, 0));
  const eventsOn = (d) => events.filter((e) => sameDay(e.start, d)).sort((a, b) => a.start - b.start);
  const tasksDueOn = (d) => tasks.filter((t) => sameDay(t.due, d));
  function load(d) {
    // 그날 바쁨 정도(0~1): 일정 시간 + 그날 마감 할 일 시간 / 10시간
    const evMin = eventsOn(d).reduce((s, e) => s + (e.end - e.start) / MIN, 0);
    const tMin = tasksDueOn(d).filter((t) => !t.done).reduce((s, t) => s + t.minutes, 0);
    return Math.min(1, (evMin + tMin) / 600);
  }
  const nextEvent = () => events.filter((e) => e.end > now).sort((a, b) => a.start - b.start)[0];

  // ── 메모 → '이대로 저장할까요?' (web/src/example.js의 examplePopup와 같은 규칙) ──
  function parseMemo(text) {
    let rest = ` ${text} `;
    let offset = null;
    let m = rest.match(/\s(오늘|내일|모레)\s?/);
    if (m) {
      offset = { 오늘: 0, 내일: 1, 모레: 2 }[m[1]];
      rest = rest.replace(m[0], ' ');
    } else if ((m = rest.match(/\s(다음\s?주\s?)?([월화수목금토일])요일\s?/))) {
      let diff = WD.indexOf(m[2]) - ((now.getDay() + 6) % 7);
      if (m[1]) diff += 7;
      else if (diff < 0) diff += 7;
      offset = diff;
      rest = rest.replace(m[0], ' ');
    }
    let time = '?';
    if ((m = rest.match(/(오전|오후)?\s?(\d{1,2})\s?시\s?(반|(\d{1,2})\s?분)?/))) {
      let hour = Number(m[2]);
      const minute = m[3] === '반' ? 30 : Number(m[4] || 0);
      if (m[1] === '오후' && hour < 12) hour += 12;
      else if (!m[1] && hour >= 1 && hour <= 7) hour += 12; // '3시 스터디'는 보통 오후 3시
      time = `${two(hour)}:${two(minute)}`;
      rest = rest.replace(m[0], ' ');
    } else if ((m = rest.match(/(\d{1,2}):(\d{2})/))) {
      time = `${two(Number(m[1]))}:${m[2]}`;
      rest = rest.replace(m[0], ' ');
    }
    if (offset === null && time === '?') return null;
    let place = '?';
    if ((m = rest.match(/\d{1,3}(-\d)?동(\s?\d{2,4}호)?|중앙도서관|학생회관|온라인/))) {
      place = m[0];
      rest = rest.replace(m[0], ' ');
    }
    const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (offset ?? 0));
    return { title: rest.replace(/\s+/g, ' ').trim() || '?', date, time, place };
  }
  const popupDateWord = (p) => `${md(p.date)}(${wd(p.date)}) · ${dayWord(p.date)}`;

  // ── 상태와 동작 ──
  const listeners = [];
  const state = { popup: null, checking: null, toast: null, saved: null, screen: 'home', week: 0, editing: false };
  const emit = () => listeners.forEach((f) => f(state));
  let toastTimer = 0;
  function toast(text, undo) {
    clearTimeout(toastTimer);
    state.toast = { text, undo };
    toastTimer = setTimeout(() => {
      state.toast = null;
      emit();
    }, 5000);
  }

  function addMemo(text, delay = 700) {
    text = text.trim();
    if (!text) return null;
    const memo = { id: id(), text, at: new Date(now.getTime() + 60000 * (memos.length - 3)), checking: true };
    memos.push(memo);
    state.checking = memo.id;
    emit();
    setTimeout(() => {
      memo.checking = false;
      state.checking = null;
      const p = parseMemo(text);
      state.popup = p ? { memoId: memo.id, ...p } : null;
      emit();
    }, delay);
    return memo;
  }
  function savePopup(fields = {}) {
    const p = { ...state.popup, ...fields };
    const [h, m] = p.time === '?' ? [9, 0] : p.time.split(':').map(Number);
    const start = new Date(p.date.getFullYear(), p.date.getMonth(), p.date.getDate(), h, m);
    const e = { id: id(), title: p.title, start, end: new Date(start.getTime() + HOUR), place: p.place === '?' ? null : p.place, source: 'memo', important: 0, fresh: true };
    events.push(e);
    const memo = memos.find((x) => x.id === p.memoId);
    if (memo) memo.event = e;
    state.popup = null;
    state.editing = false;
    state.saved = e;
    setTimeout(() => (e.fresh = false), 2500); // 새로 넣은 일정은 잠깐만 빛난다
    toast(`${dayWord(start)} ${hm(start)} '${e.title}' 달력에 넣었어요`, () => {
      events.splice(events.indexOf(e), 1);
      if (memo) memo.event = null;
      state.toast = null;
      emit();
    });
    emit();
    return e;
  }
  function cancelPopup() {
    state.popup = null;
    toast('메모로만 남겼어요. 밤 정리 때 다시 볼게요');
    emit();
  }
  function toggleTask(tid) {
    const t = tasks.find((x) => x.id === tid);
    t.done = t.done ? 0 : 1;
    if (t.done) {
      toast(`'${t.title}' 끝`, () => {
        t.done = 0;
        state.toast = null;
        emit();
      });
    }
    emit();
    return t;
  }
  function undoToast() {
    if (state.toast?.undo) state.toast.undo();
  }

  // ── 아침 브리핑 (밤 01:30 정리 결과를 흉내 낸 카드 한 장) ──
  function briefing() {
    const r = rankTasks();
    const first = r.top[0];
    const today = eventsOn(now);
    const later = r.tasks.slice().sort((a, b) => slack(b) - slack(a)).find((t) => t.minutes <= 60 && t !== first);
    return {
      date: `${now.getMonth() + 1}월 ${now.getDate()}일 ${wd(now)}요일`,
      headline: `오늘은 '${first.title}'부터`,
      why: `${dueWord(first)} 마감이고 ${minutesWord(first.minutes)} 걸려요. 오후 수업 사이 빈 시간에 끝낼 수 있어요.`,
      today,
      first: r.top,
      later,
      laterWhy: later ? `${dueWord(later)}까지라 ${dayWord(new Date(now.getTime() + DAY))}로 미뤄도 돼요` : '',
      night: '어젯밤 메모 2개 → 할 일 1개로 정리했어요',
      busy: load(now),
    };
  }

  // ── 화면 모드: 주소 끝 #app / #desktop / #web, 뒤에 -popup -brief -cal -memo, 캡처는 -shot ──
  const MODES = ['app', 'desktop', 'web'];
  const SCREENS = ['home', 'cal', 'memo', 'brief', 'popup'];
  function readView() {
    const parts = location.hash.slice(1).split('-').filter(Boolean);
    return {
      mode: parts.find((p) => MODES.includes(p)) || (innerWidth < 700 ? 'app' : 'web'),
      screen: parts.find((p) => SCREENS.includes(p)) || 'home',
      shot: parts.includes('shot'),
    };
  }
  // 캡처·보고서용 상태를 미리 만든다
  function prepare(view) {
    state.screen = view.screen === 'popup' ? 'memo' : view.screen;
    if (view.screen === 'popup') {
      memos.push({ id: id(), text: '내일 3시 301동 스터디', at: ago(1) });
      state.popup = { memoId: memos[memos.length - 1].id, ...parseMemo('내일 3시 301동 스터디') };
    }
  }

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  // 다시 그려도 입력 중인 글·포커스·스크롤이 남게 한다.
  // data-keep-scroll="이름": 스크롤 위치 유지(처음엔 data-scroll-to px), data-scroll-end: 늘 맨 아래로
  function mount(root, html) {
    const active = document.activeElement && document.activeElement.id;
    const vals = {};
    root.querySelectorAll('input[id],textarea[id]').forEach((el) => (vals[el.id] = el.value));
    const scrolls = {};
    root.querySelectorAll('[data-keep-scroll]').forEach((el) => (scrolls[el.dataset.keepScroll] = el.scrollTop));
    root.innerHTML = html;
    for (const [k, v] of Object.entries(vals)) {
      const el = document.getElementById(k);
      if (el && !('fresh' in el.dataset)) el.value = v;
    }
    root.querySelectorAll('[data-keep-scroll]').forEach((el) => {
      const k = el.dataset.keepScroll;
      el.scrollTop = k in scrolls ? scrolls[k] : Number(el.dataset.scrollTo || 0);
    });
    root.querySelectorAll('[data-scroll-end]').forEach((el) => (el.scrollTop = el.scrollHeight));
    if (active) document.getElementById(active)?.focus();
  }

  // 누르는 것 공통 처리: data-act="task|save|cancel|edit|undo|screen|week|try|brief", 메모 칸 = form 안 [data-memo-input]
  function readPopupForm() {
    const val = (k) => document.getElementById(`pf-${k}`)?.value.trim() || '?';
    return { title: val('title'), time: val('time'), place: val('place') };
  }
  function bind(root, extra = {}) {
    root.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const act = el.dataset.act;
      const arg = el.dataset.arg;
      if (extra[act]) return extra[act](arg, el, e);
      if (act === 'task') toggleTask(Number(arg));
      else if (act === 'save') savePopup(state.editing ? readPopupForm() : {});
      else if (act === 'cancel') {
        state.editing = false;
        cancelPopup();
      } else if (act === 'edit') {
        state.editing = true;
        emit();
      } else if (act === 'undo') undoToast();
      else if (act === 'screen') {
        state.screen = arg;
        emit();
      } else if (act === 'week') {
        state.week = Math.max(0, Math.min(2, state.week + Number(arg)));
        emit();
      } else if (act === 'try') {
        const input = root.querySelector('[data-memo-input]');
        if (input) {
          input.value = arg;
          input.focus();
        }
      }
    });
    root.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = e.target.querySelector('[data-memo-input]');
      if (!input) return;
      const text = input.value;
      input.value = '';
      addMemo(text);
    });
  }

  // 시험해 볼 메모 예시(시연 칸 아래 칩으로)
  const tryMemos = ['내일 3시 301동 스터디', '공수 연습문제 4장', '금요일 7시 학생회관 동아리 회식', '다음 주 월요일 오전 10시 면담', '실험 보고서 그래프 다시 그리기'];

  // 보고서 밖에서 열었을 때만 보이는 작은 모드 전환 막대
  function devbar(view, name) {
    if (view.shot || window.self !== window.top) return;
    document.documentElement.classList.add('ty-has-bar');
    dispatchEvent(new Event('resize'));
    const bar = document.createElement('nav');
    bar.className = 'ty-devbar';
    bar.innerHTML = `<b>${name}</b>${[['app', '모바일 앱'], ['desktop', '데스크톱 앱'], ['web', '웹']]
      .map(([m, label]) => `<a href="#${m}" ${m === view.mode ? 'aria-current="page"' : ''}>${label}</a>`)
      .join('')}`;
    document.body.append(bar);
    const css = document.createElement('style');
    css.textContent = `.ty-devbar{position:fixed;z-index:9999;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));display:flex;gap:2px;align-items:center;padding:4px;border-radius:999px;background:#111c;backdrop-filter:blur(10px);font:500 12px/1 system-ui,sans-serif;color:#fff;box-shadow:0 6px 24px #0004}
.ty-devbar b{padding:0 10px;font-weight:700;white-space:nowrap}.ty-devbar a{color:#fffc;text-decoration:none;padding:8px 10px;border-radius:999px;white-space:nowrap}.ty-devbar a[aria-current]{background:#fff;color:#111}
html.ty-has-bar.ty-mode-app body,html.ty-has-bar.ty-mode-desktop body{padding-top:48px;box-sizing:border-box}
html.ty-has-bar.ty-mode-web body{padding-top:0}html.ty-has-bar.ty-mode-web .ty-devbar{top:auto;bottom:max(12px,env(safe-area-inset-bottom))}
html.ty-phone-full .ty-devbar{display:none}`;
    document.head.append(css);
    addEventListener('hashchange', () => location.reload());
  }

  // 모드별 겉틀: 앱은 390×844 폰, 데스크톱은 1280×800 창. 화면이 작으면 통째로 줄여(zoom) 보여 준다.
  let zoom = 1;
  function frame(view) {
    const html = document.documentElement;
    html.classList.add(`ty-mode-${view.mode}`);
    if (view.shot) html.classList.add('ty-shot');
    const css = document.createElement('style');
    css.textContent = `html.ty-mode-app body,html.ty-mode-desktop body{display:grid;place-items:center;min-height:100vh;margin:0;overflow:hidden}
.ty-phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:46px;box-shadow:0 0 0 10px #0b0b0d,0 0 0 11px #3a3a40,0 30px 80px #0006;isolation:isolate;zoom:var(--ty-z,1)}
.ty-window{position:relative;width:1280px;height:800px;overflow:hidden;border-radius:12px;box-shadow:0 0 0 1px #0003,0 30px 90px #0005;isolation:isolate;zoom:var(--ty-z,1)}
html.ty-phone-full .ty-phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none;zoom:1}
html.ty-shot .ty-phone{width:100vw;height:100vh;border-radius:0;box-shadow:none;zoom:1}
html.ty-shot .ty-window{border-radius:0;zoom:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}}`;
    document.head.append(css);
    const fit = () => {
      if (view.shot) return;
      const small = view.mode === 'app' && innerWidth < 520;
      html.classList.toggle('ty-phone-full', small);
      const [w, h] = view.mode === 'app' ? [390 + 40, 844 + 40] : [1280 + 48, 800 + 48];
      const bar = html.classList.contains('ty-has-bar') ? 48 : 0;
      zoom = small || view.mode === 'web' ? 1 : Math.min(1, innerWidth / w, (innerHeight - bar) / h);

    };

  add(arg) { // 후보 → 할 일(기한 = 고른 날 자정) 또는 빼기
    const [id, n] = arg.split(':'), m = T.memos.find((x) => String(x.id) === id);
    if (n === 'x') { m.skip = 1; return render(); }
    const due = new Date(T.now); due.setDate(due.getDate() + +n); due.setHours(23, 59, 0, 0);
    m.task = { id: -m.id, title: m.text, course: m.course || '메모', due, minutes: 30, ready: 1, done: 0 }; // ponytail: 걸리는 시간은 30분으로 둔다, 실제 앱은 '고치기'에서 바꾼다
    T.tasks.push(m.task);
    T.toast(`'${m.text}' 할 일에 넣었어요`, () => { T.tasks.splice(T.tasks.indexOf(m.task), 1); m.task = null; S.toast = null; render(); });
    render();
  },
});
root.addEventListener('submit', (ev) => { // 목록이 접혀 있으면 남겼다는 걸 알려 준다(저장은 엔진의 submit이 한다)
  if (ev.target.querySelector('[data-memo-input]')?.value.trim() && !MO && S.screen !== 'memo') T.toast('메모를 남겼어요');
}, true);
root.addEventListener('submit', (ev) => { // 친구 요청 · 그룹 만들기
  const v = ev.target.querySelector('input')?.value.trim();
  if (!v || !ev.target.matches('[data-pal], [data-group]')) return;
  if (ev.target.matches('[data-pal]')) { ev.target.querySelector('input').value = ''; return addPal(/^ty-?\d+$/i.test(v) ? NICK[PID % NICK.length] : v); }
  if (!GSEL.length) { T.toast('넣을 친구를 먼저 골라 주세요'); return render(); }
  ev.target.querySelector('input').value = ''; GROUPS.push({ id: ++PID, name: v, ids: GSEL }); GSEL = [];
  T.toast(`'${v}' 그룹을 만들었어요`); render();
});
root.addEventListener('submit', (ev) => { // 직접 넣기 시트의 '넣기'(엔진의 submit은 메모 칸만 본다)
  if (!ev.target.matches('[data-new]')) return;
  ev.preventDefault();
  const val = (k) => document.getElementById(`nw-${k}`).value.trim(), at = (hm) => new Date(`${val('date')}T${hm}`);
  const start = at(val('start')), end = at(val('end'));
  if (!val('title') || isNaN(start)) return; // 빈 칸은 브라우저가 먼저 막는다
  const e = { id: Date.now(), title: val('title'), start, end: end > start ? end : new Date(+start + T.HOUR), place: val('place') || null, source: 'own', important: 0, fresh: true };
  T.events.push(e);
  if (!(CV === 'day' && off(start) === CA)) S.saved = e; // 보고 있던 날이 아니면 그 주로 옮겨 보여 준다
  NEW = null;
  setTimeout(() => (e.fresh = false), 2500);
  T.toast(`${T.dayWord(start)} ${T.hm(start)} '${e.title}' 달력에 넣었어요`, () => { T.events.splice(T.events.indexOf(e), 1); S.toast = null; render(); });
  render();
});
root.addEventListener('scroll', (e) => { // 손으로 넘겼을 때: 가운데에 가장 가까운 카드를 고른다
  const car = e.target;
  if (!car.classList || !car.classList.contains('car')) return;
  const mid = car.scrollLeft + car.clientWidth / 2, d = [...car.children].map((c) => Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid));
  setSel(d.indexOf(Math.min(...d)));
}, true);
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.popup) root.querySelector('[data-act=cancel]').click();
  if (e.key === 'Escape' && NEW) { NEW = null; return render(); }
  if (e.key === 'Escape' && SH) { SH = null; return render(); }
  if (e.key === 'Escape' && MO) { MO = false; return render(); }
  const typing = e.target.matches('input'), idle = !OB && !S.popup && !NEW && !SH && !e.ctrlKey && !e.metaKey && !e.altKey;
  // M 또는 엔터 = 메모 칸으로(엔터는 단추에 초점이 있으면 그 단추를 누르는 것이니 건드리지 않는다)
  if (idle && (e.code === 'KeyM' ? !typing : e.key === 'Enter' && !e.target.closest('input, button, a'))) { e.preventDefault(); return document.getElementById('memo-in')?.focus(); }
  const tab = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0; // ↑ ↓ = 탭 옮기기, ← → = 카드 · 달력 넘기기
  if (tab && idle && !typing) { e.preventDefault(); S.screen = NAV[(Math.max(NAV.findIndex(([k]) => k === S.screen), 0) + tab + NAV.length) % NAV.length][0]; return render(); }
  const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (!step || typing || !idle) return;
  if (S.screen === 'cal') move(step); else if (ITEMS.length) go(pick[S.screen] + step, true);
});
let sx = 0, sy = 0; // 달력을 옆으로 밀면 넘어간다
root.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
root.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (!OB && S.screen === 'cal' && !S.popup && !NEW && Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) move(dx < 0 ? 1 : -1);
});
// 시연의 시계: 30초마다 맞춘다. 달력만 다시 그리고(지금 선) 다른 화면은 시각 글자만 바꾼다(고리 움직임이 끊기지 않게)
// ponytail: 자정을 넘겨도 '오늘'(T0)은 그대로다. 하루 넘게 켜 둘 일이 생기면 새로 고침 대신 T0도 다시 잡는다
if (DEMO) setInterval(() => {
  T.now.setTime(Date.now());
  const el = root.querySelector('[data-clock]'), nw = root.querySelector('[data-now]');
  if (nw) nw.textContent = T.hm(T.now); // ponytail: 글자만 맞춘다. 흰 입자 자리와 넣어 본 자리는 다음에 화면을 그릴 때 맞춰진다
  if (!OB && S.screen === 'cal' && !S.popup && !NEW && document.activeElement?.id !== 'memo-in') render(); else if (el) el.textContent = clockWord();
}, 30000);
setInterval(() => { // 집중 타이머: 가운데 숫자만 바꾸고, 다 차면 스스로 멈춘다
  if (!FOCUS) return;
  const el = root.querySelector('[data-timer]');
  if (el) el.firstChild.data = focusMin();
  if (focusMin() >= FLEN) stopFocus(false);
}, 1000);
addEventListener('resize', () => { if (PH !== narrow()) { PH = narrow(); render(); } else go(pick[S.screen], false); });
render();
if (!DEMO) T.devbar(view, '입자 고리');
</script>
</body>
