<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="메모하면 달력과 할 일로 정리되는 서울대생용 세컨브레인" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tachyon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Tachyon</title>
    <script>
      // 고른 테마를 첫 그림 전에 입힌다(11-21 — 어두운 테마가 흰 화면으로 번쩍이지 않게). 나머지는 src/themes.js applyTheme
      try {
        var t = localStorage.getItem('tachyon_theme');
        t = { 입자: '입자 밤', 종이: '입자 낮' }[t] || t;
        var bg = { '입자 밤': '#040406', '입자 낮': '#f3efe6', 태양계: '#050814', 오선지: '#f4eee2', 뉴모피즘: '#ebe4da' }[t];
        if (bg) {
          var m = document.querySelector('meta[name="theme-color"]');
          m.dataset.base = m.content;
          m.content = bg;
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
