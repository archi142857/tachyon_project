# Tachyon Project 설정은 이 파일 하나. 비밀값(API 키 등)은 여기 말고 `npx wrangler secret put 이름`.
name = "tachyon"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# 화면(web/, Vite + React)은 빌드한 web/dist가 나가고, /api/... 는 늘 worker/index.js로 온다.
# dev·deploy 때마다 [build]가 web/을 먼저 빌드한다(npm install은 이미 깔려 있으면 금방 끝난다. ci는 매번 지우고 다시 깔아서 느림).
# 화면 주소에 없는 길은 index.html(한 페이지 앱).
[build]
command = "npm --prefix web install --no-audit --no-fund && npm --prefix web run build"
watch_dir = "web/src"

[assets]
directory = "web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tachyon"
database_id = "2c6de759-4b5c-44e2-9d07-b81a1236a0d5"

# Cron (UTC). worker/index.js가 번호 파일로 보낸다. 파일이 아직 없으면 건너뛴다.
#   */15 * * * *  → 2_collect_ics.js  ICS 15분마다 수집
#   30 16 * * *   → 4_night.js        한국 01:30 밤 정리
#   */10 * * * *  → 9_etl.js          eTL API 수집(한 번에 요청 ETL_REQUESTS_PER_RUN개 안에서)
[triggers]
crons = ["*/15 * * * *", "30 16 * * *", "*/10 * * * *"]

[vars]
FEEDS_PER_RUN = "20"   # Cron 한 번에 받는 캘린더 주소 수 (무료 요금제: 한 번에 외부 요청 50개·DB 질의 50개까지)
POPUP_AI_MS = "2500"   # 즉시 팝업이 AI를 기다리는 시간(ms) — AI 세션 요청
DAILY_TASK_MIN = "180" # 하루에 할 일에 쓰는 시간(분), 밀도 계산 — AI 세션 요청
ETL_REQUESTS_PER_RUN = "40" # eTL Cron 한 번에 eTL·AI 요청 수 (무료 요금제 한 번 50개)
GITHUB_REPO = "archi142857/tachyon_project" # 의견·오류 이슈가 쌓이는 저장소 (토큰은 비밀값 GITHUB_TOKEN)

# 시간표 사진 저장 (5_timetable_photo.js). 버킷은 dhsrua555가 만듦(11-09).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "tachyon-photos"

# 대시보드 → tachyon → Logs에서 요청마다 로그·CPU 시간을 본다
[observability]
enabled = true
